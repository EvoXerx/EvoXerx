<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Banniere clown originale">
  <defs>
    <radialGradient id="bgd" cx="50%" cy="48%" r="75%">
      <stop offset="0%" stop-color="#160305"/>
      <stop offset="55%" stop-color="#090203"/>
      <stop offset="100%" stop-color="#020001"/>
    </radialGradient>
    <radialGradient id="face" cx="44%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#efeae5"/>
      <stop offset="58%" stop-color="#c8c2bc"/>
      <stop offset="82%" stop-color="#2e2020"/>
      <stop offset="100%" stop-color="#020001" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redpulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1f2d" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#8b0000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8b0000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="socket" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#000000"/><stop offset="100%" stop-color="#180808"/>
    </radialGradient>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1.2" fill="#000000" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#bgd)"/>

  <!-- pulsation rouge, pic au reveal -->
  <ellipse cx="600" cy="210" rx="640" ry="320" fill="url(#redpulse)">
    <animate attributeName="opacity" values="0;0.08;0.16;0.16;0.95;0.5;0" keyTimes="0;0.50;0.78;0.80;0.815;0.92;1" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <!-- yeux qui fixent dans le noir (phase sombre) -->
  <g fill="#ffcf3f">
    <circle cx="420" cy="140" r="9"/>
    <circle cx="780" cy="140" r="9"/>
    <animate attributeName="opacity" values="0.9;0.95;0;0;0;0;0.9" keyTimes="0;0.50;0.78;0.80;0.815;0.92;1" dur="9s" repeatCount="indefinite"/>
  </g>

  <!-- VISAGE en gros plan qui deborde des bords -->
  <g transform="translate(600 230)">
    <g>
      <!-- tremblement permanent subtil -->
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;1.4 -1;-1 1.3;1 1;-1.3 -0.6;0 0" dur="0.16s" repeatCount="indefinite"/>
      <g>
        <!-- bond violent au reveal -->
        <animateTransform attributeName="transform" type="scale" values="1;1;1;1;1.18;1.11;1" keyTimes="0;0.50;0.78;0.80;0.815;0.92;1" dur="9s" repeatCount="indefinite"/>
        <g>
          <animate attributeName="opacity" values="0.03;0.10;1;1;1;1;0.03" keyTimes="0;0.50;0.78;0.80;0.815;0.92;1" dur="9s" repeatCount="indefinite"/>

          <!-- touffes de cheveux qui debordent -->
          <g fill="#7a0c12">
            <polygon points="-540,-150 -560,-360 -440,-260 -470,-430 -330,-250 -360,-390 -230,-240"/>
            <polygon points="540,-150 560,-360 440,-260 470,-430 330,-250 360,-390 230,-240"/>
          </g>

          <!-- tete (ovale organique, pas carre) -->
          <ellipse cx="0" cy="0" rx="540" ry="380" fill="url(#face)"/>

          <!-- coulures sous les yeux -->
          <g stroke="#4a1010" stroke-width="9" stroke-linecap="round" opacity="0.5">
            <line x1="-180" y1="-12" x2="-188" y2="150"/>
            <line x1="180" y1="-12" x2="188" y2="150"/>
          </g>

          <!-- sourcils baisses -->
          <g stroke="#140707" stroke-width="22" stroke-linecap="round">
            <line x1="-330" y1="-205" x2="-95" y2="-150"/>
            <line x1="330" y1="-205" x2="95" y2="-150"/>
          </g>

          <!-- orbites -->
          <ellipse cx="-180" cy="-90" rx="95" ry="78" fill="url(#socket)"/>
          <ellipse cx="180" cy="-90" rx="95" ry="78" fill="url(#socket)"/>

          <!-- pupilles : blanc -> rouge, grossissent au reveal -->
          <circle cx="-180" cy="-90" r="9" fill="#ededed">
            <animate attributeName="r" values="9;9;11;11;30;24;9" keyTimes="0;0.50;0.78;0.80;0.815;0.92;1" dur="9s" repeatCount="indefinite"/>
            <animate attributeName="fill" values="#ededed;#ededed;#ededed;#ededed;#ff1f2d;#ff1f2d;#ededed" keyTimes="0;0.50;0.78;0.80;0.815;0.92;1" dur="9s" repeatCount="indefinite"/>
          </circle>
          <circle cx="180" cy="-90" r="9" fill="#ededed">
            <animate attributeName="r" values="9;9;11;11;30;24;9" keyTimes="0;0.50;0.78;0.80;0.815;0.92;1" dur="9s" repeatCount="indefinite"/>
            <animate attributeName="fill" values="#ededed;#ededed;#ededed;#ededed;#ff1f2d;#ff1f2d;#ededed" keyTimes="0;0.50;0.78;0.80;0.815;0.92;1" dur="9s" repeatCount="indefinite"/>
          </circle>

          <!-- nez rouge -->
          <circle cx="0" cy="45" r="52" fill="#e01e2b"/>
          <circle cx="-16" cy="30" r="14" fill="#ff8a8f" opacity="0.7"/>

          <!-- bouche : s'elargit brutalement au reveal -->
          <path fill="#6e0a0f" stroke="#2c0507" stroke-width="3">
            <animate attributeName="d"
              values="M -150 150 Q 0 185 150 150 Q 0 205 -150 150 Z;
                      M -150 150 Q 0 185 150 150 Q 0 205 -150 150 Z;
                      M -175 145 Q 0 192 175 145 Q 0 230 -175 145 Z;
                      M -175 145 Q 0 192 175 145 Q 0 230 -175 145 Z;
                      M -360 105 Q 0 205 360 105 Q 0 430 -360 105 Z;
                      M -345 108 Q 0 200 345 108 Q 0 415 -345 108 Z;
                      M -150 150 Q 0 185 150 150 Q 0 205 -150 150 Z"
              keyTimes="0;0.50;0.78;0.80;0.815;0.92;1" dur="9s" repeatCount="indefinite"/>
          </path>

          <!-- dents : apparaissent au reveal -->
          <g fill="#efefe9">
            <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.50;0.78;0.80;0.815;0.92;1" dur="9s" repeatCount="indefinite"/>
            <polygon points="-300,118 -240,118 -270,215"/>
            <polygon points="-230,132 -170,132 -200,235"/>
            <polygon points="-160,145 -100,145 -130,242"/>
            <polygon points="-90,151 -30,151 -60,246"/>
            <polygon points="-20,154 40,154 10,248"/>
            <polygon points="50,151 110,151 80,245"/>
            <polygon points="120,144 180,144 150,240"/>
            <polygon points="190,132 250,132 220,232"/>
            <polygon points="260,118 320,118 290,214"/>
          </g>

          <!-- GLITCH : actif uniquement au reveal -->
          <g>
            <animate attributeName="opacity" values="0;0;0;0;1;0.7;0" keyTimes="0;0.50;0.78;0.80;0.815;0.92;1" dur="9s" repeatCount="indefinite"/>
            <!-- decalage RVB de la bouche -->
            <path d="M -360 105 Q 0 205 360 105 Q 0 430 -360 105 Z" fill="#00e5ff" opacity="0.35" transform="translate(-12 4)"/>
            <path d="M -360 105 Q 0 205 360 105 Q 0 430 -360 105 Z" fill="#ff1f2d" opacity="0.35" transform="translate(12 -4)"/>
            <!-- tearing horizontal -->
            <g fill="#ffffff" opacity="0.16">
              <rect x="-560" y="-150" width="1120" height="10">
                <animate attributeName="x" values="-560;-520;-590;-560" dur="0.17s" repeatCount="indefinite"/>
              </rect>
              <rect x="-560" y="20" width="1120" height="8">
                <animate attributeName="x" values="-560;-600;-530;-560" dur="0.21s" repeatCount="indefinite"/>
              </rect>
              <rect x="-560" y="180" width="1120" height="9">
                <animate attributeName="x" values="-560;-510;-580;-560" dur="0.13s" repeatCount="indefinite"/>
              </rect>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- scanlines permanentes -->
  <rect width="1200" height="400" fill="url(#scan)" opacity="0.35"/>

  <!-- flash rouge au reveal -->
  <rect width="1200" height="400" fill="#ff1f2d">
    <animate attributeName="opacity" values="0;0;0;0;0.42;0.08;0" keyTimes="0;0.50;0.78;0.80;0.815;0.92;1" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
